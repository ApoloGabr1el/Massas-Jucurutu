<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Massas Jucurutu - Produtos</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div id="navbar"></div>
    </header>

    
    <section class="main main--produtos">
      <div class="hero">
        <span class="hero__badge">🌾</span>
        <h1 class="hero__title">
          <span>Nossos</span>
          <span>Produtos</span>
           
        </h1>
        <h2 class="hero__text">
          <p>o sabor e tradição da nossa terra</p>
          <p>em cada mordida</p>
        </h2>
      </div>
    </section>

    <!-- Seção de Produtos -->
    <section class="produtos">
      <h3>Produtos</h3>
      <div class="produtos-lista">
        <div class="produtos_item">
          <img class="item_img" src="assets/maisena.png" alt="Biscoito Maisena">
          <h4>Maisena</h4>
          <button class="btn-saiba">Saiba mais →</button>
        </div>

        <div class="produtos_item">
          <img class="item_img" src="assets/tareco.png" alt="Biscoito Tareco">
          <h4>Tareco</h4>
          <button class="btn-saiba">Saiba mais →</button>
        </div>

        <div class="produtos_item">
          <img class="item_img" src="assets/manteigada.png" alt="Biscoito Manteigada">
          <h4>Manteigada</h4>
          <button class="btn-saiba">Saiba mais →</button>
        </div>

        <div class="produtos_item">
          <img class="item_img" src="assets/maragogi.png" alt="Biscoito Maragogi">
          <h4>Maragogi</h4>
          <button class="btn-saiba">Saiba mais →</button>
        </div>

        <div class="produtos_item">
          <img class="item_img" src="assets/mateiga_serta.png" alt="Biscoito Manteiga Serta">
          <h4>Manteiga Serta</h4>
          <button class="btn-saiba">Saiba mais →</button>
        </div>

        <div class="produtos_item">
          <img class="item_img" src="assets/tradicao.png" alt="Biscoito Tradição">
          <h4>Tradição</h4>
          <button class="btn-saiba">Saiba mais →</button>
        </div>
        
        <div class="produtos_item">
          <img class="item_img" src="assets/sete capas.png" alt="Biscoito Sete Capas">
          <h4>Sete Capas</h4>
          <button class="btn-saiba">Saiba mais →</button>
        </div>
        
        <div class="produtos_item">
          <img class="item_img" src="assets/quadrada.png" alt="Biscoito Quadrada">
          <h4>Quadrada</h4>
          <button class="btn-saiba">Saiba mais →</button>
        </div>
      </div>
    </section>

    <footer>
      <section class="footer">
        <div class="texts">
          <span class="footer-text">Políticas de Privacidade</span>
          <span class="footer-text">Termos de Uso</span>
          <span class="footer-text">Investidores</span>
          <span class="footer-text">Seja nosso cliente</span>
          <span class="footer-text">Fale conosco</span>
        </div>
        <div class="footer-section-icons">
          <!-- SVGs aqui -->
        </div>
        <span class="copyright">Copyright® Massas Jucurutu</span>
      </section>
    </footer>

    <script>    
      fetch("components/navbar.html")
        .then((resposta) => resposta.text())
        .then((html) => {
          document.querySelector("#navbar").innerHTML = html;
        });
    </script>
  </body>
</html>
