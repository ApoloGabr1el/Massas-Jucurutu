<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Massas Jucurutu</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div id="navbar"></div>
      <section class="apresentaçao">
        <img
          class="apresentaçao__logo"
          src="/assets/Massas-Jucurutu-logo.png"
          alt="Logo Massas Jucurutu"
        />
      </section>
    </header>

    <section class="main">

      <section class="produtos">
        
        <div class="produtos_item">
          <img class="item_img" src="assets/maisena.png" alt="">
          </div>

        <div class="produtos_item"">
          <img class="item_img" src="assets/tareco.png" alt="">
          </div>

        <div class="produtos_item">
          <img class="item_img" src="assets/manteigada.png" alt="">
          </div>

        <div class="produtos_item">
          <img class="item_img" src="assets/maragogi.png" alt="">
          </div>

        <div class="produtos_item">
          <img class="item_img" src="assets/mateiga_serta.png" alt="" >
          </div>

        <div class="produtos_item">
          <img class="item_img" src="assets/palito.png" alt="">
        </div> 
      </section>


    </section>


    
    
    <footer>
      <section class="footer">

      </section>
    </footer>
    <script>
      fetch("components/navbar.html")
        .then((resposta) => resposta.text())
        .then((html) => {
          document.querySelector("#navbar").innerHTML = html;
        });
    </script>
  </body>
</html>
